#
# weechat -- fset.conf
#
# WARNING: It is NOT recommended to edit this file by hand,
# especially if WeeChat is running.
#
# Use commands like /set or /fset to change settings in WeeChat.
#
# For more info, see: https://weechat.org/doc/weechat/quickstart/
#

[look]
auto_refresh = "*"
auto_unmark = off
condition_catch_set = "${count} >= 1"
export_help_default = on
format_number = 1
marked_string = "*"
scroll_horizontal = 10
show_plugins_desc = off
sort = "~name"
unmarked_string = " "
use_color_value = on
use_keys = on
use_mute = off

[format]
export_help = "# ${description2}"
export_option = "/set ${name} ${quoted_value}"
export_option_null = "/unset ${name}"
option1 = ""
option2 = "${marked} ${name}  ${type}  ${value2}${newline}  ${empty_name}  ${_default_value}${color:244} -- ${_allowed_values}${newline}  ${empty_name}  ${_description}"

[color]
allowed_values = default
allowed_values_selected = default
color_name = darkgray
color_name_selected = darkgray
default_value = default
default_value_selected = default
description = 242
description_selected = 242
file = default
file_changed = 94
file_changed_selected = 94
file_selected = default
help_default_value = default
help_description = default
help_name = default
help_quotes = darkgray
help_values = default
index = 24
index_selected = 24
line_marked_bg1 = 193
line_marked_bg2 = 193
line_selected_bg1 = 117
line_selected_bg2 = 117
marked = 94
marked_selected = 94
max = default
max_selected = default
min = default
min_selected = default
name = default
name_changed = red
name_changed_selected = red
name_selected = default
option = default
option_changed = 94
option_changed_selected = 94
option_selected = default
parent_name = default
parent_name_selected = default
parent_value = 24
parent_value_selected = 24
quotes = darkgray
quotes_changed = default
quotes_changed_selected = default
quotes_selected = default
section = default
section_changed = 94
section_changed_selected = 94
section_selected = default
string_values = default
string_values_selected = default
title_count_options = 30
title_current_option = 30
title_filter = 18
title_marked_options = 94
title_sort = darkgray
type = 58
type_selected = 58
unmarked = default
unmarked_selected = default
value = 20
value_changed = red
value_changed_selected = red
value_selected = 20
value_undef = magenta
value_undef_selected = magenta
