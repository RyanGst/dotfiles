#
# weechat -- script.conf
#
# WARNING: It is NOT recommended to edit this file by hand,
# especially if WeeChat is running.
#
# Use commands like /set or /fset to change settings in WeeChat.
#
# For more info, see: https://weechat.org/doc/weechat/quickstart/
#

[look]
columns = "%s %n %V %v %u | %d | %t"
diff_color = on
diff_command = "auto"
display_source = on
quiet_actions = on
sort = "i,p,n"
translate_description = on
use_keys = on

[color]
status_autoloaded = default
status_held = 202
status_installed = 21
status_obsolete = magenta
status_popular = 94
status_running = 23
status_unknown = red
text = default
text_bg = default
text_bg_selected = 117
text_date = darkgray
text_date_selected = darkgray
text_delimiters = 251
text_description = default
text_description_selected = default
text_extension = lightblue
text_extension_selected = lightblue
text_name = 18
text_name_selected = 18
text_selected = default
text_tags = 94
text_tags_selected = 94
text_version = 58
text_version_loaded = default
text_version_loaded_selected = default
text_version_selected = 58

[scripts]
autoload = on
cache_expire = 1440
download_enabled = on
download_timeout = 30
hold = ""
path = "${weechat_cache_dir}/script"
url = "https://weechat.org/files/plugins.xml.gz"
